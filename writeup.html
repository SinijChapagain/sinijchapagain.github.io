<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeup | Sinij Chapagain</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230b1220' stroke='%232dd4bf' stroke-width='2'/><text x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='%232dd4bf' text-anchor='middle'>SC</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles/main.css?v=2">
    <script src="config.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
</head>
<body>
    <div id="read-progress"></div>
    <nav>
        <div class="wrap nav-inner">
            <a href="index.html" class="brand"><span class="brand-mark">SC</span>Sinij Chapagain</a>
            <div class="nav-links">
                <a href="index.html#writeups">Writeups</a>
                <a href="assets/Sinij_Chapagain_CV.pdf" class="btn btn-sm" target="_blank" rel="noopener"><i class="fas fa-file-arrow-down"></i> CV</a>
            </div>
        </div>
    </nav>

    <article class="reader">
        <a class="back" href="index.html#writeups">← All writeups</a>
        <div class="reader-head" id="head"></div>
        <div class="prose" id="content"><p style="color:var(--muted)">Loading…</p></div>
    </article>

    <footer>
        <div class="wrap footer-inner">
            <span>© <span id="year"></span> Sinij Chapagain</span>
            <div class="links"><a href="index.html">Home</a><a href="https://www.linkedin.com/in/sinij-chapagain-8588031b0/" target="_blank" rel="noopener">LinkedIn</a></div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const slug = new URLSearchParams(location.search).get('w');
        const w = WRITEUPS.find(x => x.slug === slug);
        const head = document.getElementById('head');
        const content = document.getElementById('content');

        if (!w) {
            head.innerHTML = '<h1>Writeup not found</h1>';
            content.innerHTML = '<p><a href="index.html#writeups">Browse all writeups</a></p>';
        } else {
            document.title = `${w.title} | Sinij Chapagain`;
            const date = new Date(w.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            head.innerHTML = `
                <div class="writeup-meta">
                    <span>${esc(w.platform)}</span>
                    <span class="badge ${esc(w.difficulty.toLowerCase())}">${esc(w.difficulty)}</span>
                    <span>${esc(w.os)}</span>
                    <span>${esc(date)}</span>
                </div>
                <h1>${esc(w.title)}</h1>
                <p style="color:var(--muted)">${esc(w.excerpt)}</p>
                <div class="tags" style="margin-top:16px">${w.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;

            fetch(`writeups/markdown/${encodeURIComponent(w.slug)}.md`)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
                .then(md => {
                    content.innerHTML = marked.parse(md);
                    var ordered = WRITEUPS.slice().sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
                    var ci = ordered.findIndex(function(x){ return x.slug === w.slug; });
                    var pv = ordered[ci+1], nx = ordered[ci-1];
                    var rn = '<div class="reader-nav">';
                    rn += pv ? '<a class="rn prev" href="writeup.html?w='+encodeURIComponent(pv.slug)+'"><span>\u2190 Previous</span><b>'+esc(pv.title)+'</b></a>' : '<span></span>';
                    rn += nx ? '<a class="rn next" href="writeup.html?w='+encodeURIComponent(nx.slug)+'"><span>Next \u2192</span><b>'+esc(nx.title)+'</b></a>' : '<span></span>';
                    rn += '</div>';
                    content.insertAdjacentHTML('afterend', rn);
                    // hide images whose files haven't been uploaded yet rather than showing broken icons
                    content.querySelectorAll('img').forEach(img => {
                        if (img.complete && !img.naturalWidth) img.remove();
                        else img.addEventListener('error', () => img.remove());
                    });
                })
                .catch(() => { content.innerHTML = '<p>Could not load this writeup. Please try again later.</p>'; });
        }
    </script>
    <button class="to-top" id="to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <script>
      (function(){
        var bar = document.getElementById('read-progress'), top = document.getElementById('to-top');
        function onScroll(){ var h = document.documentElement; var st = h.scrollTop || document.body.scrollTop; var max = h.scrollHeight - h.clientHeight; var p = max > 0 ? st/max : 0; if(bar) bar.style.width = (p*100).toFixed(1)+'%'; if(top) top.classList.toggle('show', st > 600); }
        window.addEventListener('scroll', onScroll, { passive:true }); window.addEventListener('resize', onScroll); onScroll();
        if(top) top.addEventListener('click', function(){ window.scrollTo({ top:0, behavior:'smooth' }); });
      })();
    </script>
    <!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b2da0eedea024de8b80f93ceae3d9bde"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
